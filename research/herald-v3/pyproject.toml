[project]
name = "herald-v3"
version = "0.1.0"
description = "Research toward quality-aware KV-cache compression decisions"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "poethepoet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald_v3"]

[tool.ruff]
line-length = 78
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
fmt = "ruff format src tests"
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
typecheck = "mypy"
test = "pytest -q"
check = ["format-check", "lint", "typecheck", "test"]
