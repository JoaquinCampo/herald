<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .root { fill: #14213d; stroke: #0b1226; stroke-width: 3; }
      .phase0 { fill: #d7f0e4; stroke: #3b7f5f; stroke-width: 2; }
      .phase1 { fill: #dce9ff; stroke: #436aa8; stroke-width: 2; }
      .phase2 { fill: #fff0c7; stroke: #a37718; stroke-width: 2; }
      .future { fill: #f2dcff; stroke: #7b4a94; stroke-width: 2; }
      .risk { fill: #ffe1d6; stroke: #a84f37; stroke-width: 2; }
      .artifact { fill: #ffffff; stroke: #726d64; stroke-width: 1.5; }
      .line { fill: none; stroke: #3f3a32; stroke-width: 2.2; opacity: 0.7; }
      .title { font: 700 32px Georgia, serif; fill: #ffffff; }
      .subtitle { font: 600 20px Georgia, serif; fill: #1f2937; }
      .body { font: 16px Menlo, Consolas, monospace; fill: #1f2937; }
      .small { font: 14px Menlo, Consolas, monospace; fill: #374151; }
      .white { fill: #ffffff; }
      .muted { fill: #6b7280; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1250"/>

  <text x="900" y="55" text-anchor="middle" style="font: 700 38px Georgia, serif; fill: #14213d;">
    HERALD Mindmap: Measurement -> Prediction -> Control
  </text>
  <text x="900" y="88" text-anchor="middle" class="small">
    Current status: Phase 1 measurement validated; Phase 2 predictor evaluation underway
  </text>

  <!-- Root -->
  <rect class="root" x="650" y="500" rx="28" ry="28" width="500" height="210"/>
  <text x="900" y="555" text-anchor="middle" class="title">HERALD</text>
  <text x="900" y="595" text-anchor="middle" class="white" style="font: 19px Menlo, Consolas, monospace;">
    Predict compression-attributable damage
  </text>
  <text x="900" y="625" text-anchor="middle" class="white" style="font: 19px Menlo, Consolas, monospace;">
    from cheap online signals
  </text>
  <text x="900" y="665" text-anchor="middle" class="white" style="font: 17px Menlo, Consolas, monospace;">
    Goal: dynamic KV-cache compression controller
  </text>

  <!-- Lines from root -->
  <path class="line" d="M650 560 C470 490, 340 405, 265 300"/>
  <path class="line" d="M735 500 C615 380, 510 260, 430 150"/>
  <path class="line" d="M1065 500 C1215 380, 1325 265, 1420 150"/>
  <path class="line" d="M1150 595 C1330 585, 1470 560, 1580 500"/>
  <path class="line" d="M1060 710 C1210 840, 1320 960, 1430 1080"/>
  <path class="line" d="M735 710 C595 845, 505 965, 400 1085"/>
  <path class="line" d="M650 635 C470 665, 315 710, 215 790"/>

  <!-- North Star -->
  <rect class="artifact" x="70" y="210" rx="18" ry="18" width="400" height="200"/>
  <text x="270" y="248" text-anchor="middle" class="subtitle">North Star</text>
  <text x="95" y="285" class="body">Make compression a controllable</text>
  <text x="95" y="312" class="body">cost-quality knob.</text>
  <text x="95" y="352" class="body">Not just "is output bad?"</text>
  <text x="95" y="379" class="body">Ask: did compression cause damage?</text>

  <!-- Phase 0 -->
  <rect class="phase0" x="210" y="70" rx="18" ry="18" width="470" height="220"/>
  <text x="445" y="108" text-anchor="middle" class="subtitle">Phase 0: Dry Run - Done</text>
  <text x="240" y="145" class="body">Built matched-prefix replay</text>
  <text x="240" y="172" class="body">Built parquet substrate</text>
  <text x="240" y="199" class="body">Validated schema and metrics</text>
  <text x="240" y="226" class="body">Found JS saturation at token level</text>
  <text x="240" y="253" class="body">Pivoted target to trajectory severity</text>

  <!-- Phase 1 -->
  <rect class="phase1" x="1110" y="70" rx="18" ry="18" width="590" height="300"/>
  <text x="1405" y="108" text-anchor="middle" class="subtitle">Phase 1: Measurement - Passed</text>
  <text x="1140" y="145" class="body">Ran 32,852 compressed runs</text>
  <text x="1140" y="172" class="body">4 tasks, 6 presses, 7 ratios + baselines</text>
  <text x="1140" y="199" class="body">Finalized runs/tokens/replay artifacts</text>
  <text x="1140" y="226" class="body">Built run_damage.parquet</text>
  <text x="1140" y="253" class="body">Post-hoc deterministic scoring fixed labels</text>
  <text x="1140" y="280" class="body">Success criterion passed 4 of 4 tasks</text>
  <text x="1140" y="325" class="small">Key result: intrinsic trajectory damage aligns</text>
  <text x="1140" y="348" class="small">with user-facing harm across task regimes.</text>

  <!-- Phase 2 -->
  <rect class="phase2" x="1250" y="430" rx="18" ry="18" width="500" height="310"/>
  <text x="1500" y="468" text-anchor="middle" class="subtitle">Phase 2: Predictor - Current</text>
  <text x="1280" y="505" class="body">Question: can cheap online signals</text>
  <text x="1280" y="532" class="body">predict future damage early?</text>
  <text x="1280" y="572" class="body">Token/segment dataset built from:</text>
  <text x="1305" y="599" class="small">tokens + replay + run_damage</text>
  <text x="1280" y="636" class="body">Validation so far:</text>
  <text x="1305" y="663" class="small">max_score vs ROUGE-L drop: rho 0.73</text>
  <text x="1305" y="686" class="small">max_score vs sum_js: rho 0.74</text>
  <text x="1305" y="709" class="small">looping AUROC 0.81; non-term 0.84</text>

  <!-- Dataset / Measurement core -->
  <rect class="artifact" x="80" y="690" rx="18" ry="18" width="520" height="315"/>
  <text x="340" y="728" text-anchor="middle" class="subtitle">Measurement Stack</text>
  <text x="110" y="765" class="body">1. Paired baseline comparison</text>
  <text x="135" y="792" class="small">same prompt, compressed vs uncompressed</text>
  <text x="110" y="830" class="body">2. Matched-prefix replay</text>
  <text x="135" y="857" class="small">same generated prefix, compare logits</text>
  <text x="110" y="895" class="body">3. run_damage.parquet</text>
  <text x="135" y="922" class="small">trajectory + text drift + task scores + tags</text>
  <text x="110" y="960" class="body">4. Alignment matrix</text>
  <text x="135" y="987" class="small">do intrinsic metrics predict real harm?</text>

  <!-- Offline analyses -->
  <rect class="artifact" x="650" y="785" rx="18" ry="18" width="500" height="355"/>
  <text x="900" y="823" text-anchor="middle" class="subtitle">Offline Analysis Scaffold</text>
  <text x="680" y="860" class="body">Event study</text>
  <text x="705" y="887" class="small">What does collapse look like around onset?</text>
  <text x="680" y="925" class="body">Lead-time curves</text>
  <text x="705" y="952" class="small">How many tokens before failure is signal visible?</text>
  <text x="680" y="990" class="body">Information ceiling</text>
  <text x="705" y="1017" class="small">Does online signal beat position/ratio shortcuts?</text>
  <text x="680" y="1055" class="body">Cross-press transfer matrix</text>
  <text x="705" y="1082" class="small">Universal failure signature or per-press calibration?</text>

  <!-- Future -->
  <rect class="future" x="1220" y="890" rx="18" ry="18" width="530" height="260"/>
  <text x="1485" y="928" text-anchor="middle" class="subtitle">Next Phases</text>
  <text x="1250" y="965" class="body">Phase 2 finish line</text>
  <text x="1275" y="992" class="small">beat entropy/EWMA/position baselines</text>
  <text x="1275" y="1015" class="small">show held-out ratio/press/task robustness</text>
  <text x="1250" y="1055" class="body">Phase 3</text>
  <text x="1275" y="1082" class="small">held-out model family generalization</text>
  <text x="1250" y="1122" class="body">Phase 4</text>
  <text x="1275" y="1149" class="small">controller improves compute-quality Pareto curve</text>

  <!-- Contribution gates -->
  <rect class="risk" x="70" y="1040" rx="18" ry="18" width="530" height="170"/>
  <text x="335" y="1078" text-anchor="middle" class="subtitle">Contribution Gates</text>
  <text x="100" y="1115" class="body">Must beat trivial baselines</text>
  <text x="100" y="1142" class="body">Must transfer across presses or scope down</text>
  <text x="100" y="1169" class="body">Must validate against user-facing damage</text>
  <text x="100" y="1196" class="body">Must eventually enable intervention</text>

  <!-- Artifact list -->
  <rect class="artifact" x="660" y="285" rx="18" ry="18" width="480" height="155"/>
  <text x="900" y="323" text-anchor="middle" class="subtitle">Key Artifacts</text>
  <text x="690" y="360" class="small">results/phase1/final/{runs,tokens,replay}</text>
  <text x="690" y="385" class="small">results/phase1/metrics/run_damage.parquet</text>
  <text x="690" y="410" class="small">results/phase2/dataset/...</text>

  <!-- Legend -->
  <rect class="artifact" x="1410" y="1165" rx="12" ry="12" width="330" height="55"/>
  <circle cx="1435" cy="1193" r="9" fill="#d7f0e4" stroke="#3b7f5f"/>
  <text x="1450" y="1199" class="small">done</text>
  <circle cx="1505" cy="1193" r="9" fill="#fff0c7" stroke="#a37718"/>
  <text x="1520" y="1199" class="small">current</text>
  <circle cx="1605" cy="1193" r="9" fill="#f2dcff" stroke="#7b4a94"/>
  <text x="1620" y="1199" class="small">future</text>
</svg>
