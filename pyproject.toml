[project]
name = "herald"
version = "0.1.0"
description = "Online prediction of KV-cache compression damage from logit statistics"
requires-python = ">=3.12"
dependencies = [
    # Pinned to match Orion's warm uv cache (qa-lora-lab uses
    # 2.10.0+cu128), so the GPU install reuses cached wheels instead of
    # pulling multi-GB CUDA wheels over the choke-prone proxy.
    "torch==2.10.0",
    # kvpress 0.5.2's prefill hook reads cache_position from the
    # attention forward kwargs; the transformers v5 attention refactor
    # stopped threading it there, so the press never fires. The 4.57.x
    # line still passes cache_position and supports Llama-3.1 + Qwen3.
    "transformers>=4.57,<5",
    "kvpress>=0.5.1",
    "pydantic>=2.6",
    "datasets>=3.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    # LongBench scoring deps (rouge_score and code_sim_score)
    "rouge>=1.0",
    "fuzzywuzzy>=0.18",
    # IFEval instruction-following eval (vendored Google code deps)
    "langdetect>=1.0.9",
    "nltk>=3.8",
    "immutabledict>=2.0",
    "absl-py>=1.0",
    # torch's CUDA stack, declared as linux-only direct deps so the
    # tool.uv.sources routing below pulls them from the cu128 index
    # (already in Orion's uv cache) rather than pythonhosted. Versions
    # are pinned transitively by torch==2.10.0.
    "nvidia-cublas-cu12 ; sys_platform == 'linux'",
    "nvidia-cuda-cupti-cu12 ; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12 ; sys_platform == 'linux'",
    "nvidia-cufft-cu12 ; sys_platform == 'linux'",
    "nvidia-cufile-cu12 ; sys_platform == 'linux'",
    "nvidia-curand-cu12 ; sys_platform == 'linux'",
    "nvidia-cusolver-cu12 ; sys_platform == 'linux'",
    "nvidia-cusparse-cu12 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu12 ; sys_platform == 'linux'",
    "nvidia-nccl-cu12 ; sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12 ; sys_platform == 'linux'",
    "nvidia-nvshmem-cu12 ; sys_platform == 'linux'",
    "nvidia-nvtx-cu12 ; sys_platform == 'linux'",
    "triton ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "poethepoet>=0.27",
    "xgboost>=3.3.0",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# On Orion (linux) resolve torch and its whole CUDA stack from the
# PyTorch CUDA index so the install reuses the warm 2.10.0+cu128 wheels
# already in the uv cache (qa-lora-lab pulled them from this index). On
# macOS the default PyPI CPU wheels are used (linux-only markers).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cublas-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cuda-cupti-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cuda-nvrtc-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cuda-runtime-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cudnn-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cufft-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cufile-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-curand-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cusolver-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cusparse-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-cusparselt-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-nccl-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-nvjitlink-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-nvshmem-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
nvidia-nvtx-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[tool.ruff]
line-length = 78
src = ["src", "tests"]
extend-exclude = ["src/herald/_ifeval_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kvpress.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["herald._ifeval_vendor.*"]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langdetect.*", "absl.*", "immutabledict.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# rouge and fuzzywuzzy ship no type stubs.
module = ["rouge.*", "fuzzywuzzy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: integration tests that load a real (tiny) model; slow",
]

[tool.poe.tasks]
fmt = "ruff format src tests"
lint = "ruff check --fix src tests"
typecheck = "mypy"
test = "pytest -q"
check = ["fmt", "lint", "typecheck", "test"]
